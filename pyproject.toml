[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swift-qwen38-abliteration"
version = "0.1.0"
description = "Reproducible refusal-direction experiments for Swift Qwen3.8 27B"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
gpu = [
  "accelerate==1.15.0",
  "datasets==5.0.1",
  "causal-conv1d==1.7.0; platform_system == 'Linux'",
  "flash-linear-attention==0.5.2; platform_system == 'Linux'",
  "pillow==12.3.0",
  "protobuf==6.32.1",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers[serving]==5.17.0",
]
eval = [
  "lm-eval[api]==0.4.13",
  "openai==3.13.0",
]

[project.scripts]
swift-abliterate = "swift_abliteration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
